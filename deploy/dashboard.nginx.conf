# nginx template (envsubst runs on ${AETHERDUST_API_UPSTREAM} at container start).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # the SPA: hashed assets are immutable, index.html never is
  location / {
    try_files $uri /index.html;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # same-origin API. /metrics is deliberately NOT proxied: scrape the api directly on the private network.
  location /v1/ {
    proxy_pass ${AETHERDUST_API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # ?wait= long-polls
  }
  location = /healthz {
    proxy_pass ${AETHERDUST_API_UPSTREAM}/healthz;
  }
}
