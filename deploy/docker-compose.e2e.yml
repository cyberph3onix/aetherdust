# Override that publishes the proof server to the host: for the e2e suite, for deploying/proving from the host
# (`examples/example-dapp` deploy-counter), and for the example DApp in a browser. Never use it for a real deployment
# (plan §18: the proof server sees the sponsor's witness data).
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.e2e.yml --profile <local-midnight|testnet> up -d proof-server
services:
  proof-server:
    ports: ['${MIDNIGHT_PROOF_SERVER_PORT:-6300}:6300']
