# Override for running the e2e suite from the host against the `local-midnight` profile: publishes the proof server
# (the e2e USER wallet proves its own contract call). Never use this override for a real deployment (plan §18).
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.e2e.yml --profile local-midnight up -d --wait midnight-node indexer proof-server
services:
  proof-server:
    ports: ['${MIDNIGHT_PROOF_SERVER_PORT:-6300}:6300']
