# Publishes the Private Allowlist Access DApp to GitHub Pages.
# Enable it once under Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# The page is static. It talks to whatever AetherDust API and proof server the visitor configures in its
# "Connection settings" panel — so those must be reachable over https from the browser (a tunnel, or a hosted
# deployment). Running the DApp locally with `pnpm dev` needs no tunnel at all.
name: pages
on:
  push:
    branches: [main]
    paths: ['examples/allowlist-dapp/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.3.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: build the DApp for the Pages project path
        run: pnpm --filter @aetherdust/allowlist-dapp build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: examples/allowlist-dapp/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
