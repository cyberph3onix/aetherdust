name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly e2e on a real `undeployed` stack (plan §21)
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: aetherdust, POSTGRES_PASSWORD: aetherdust, POSTGRES_DB: aetherdust_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.3.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          AETHERDUST_TEST_DATABASE_URL: postgres://aetherdust:aetherdust@localhost:5432/aetherdust_test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t aetherdust:ci .
      - run: docker run --rm aetherdust:ci cli 2>&1 | grep -q usage
      - run: docker run --rm aetherdust:ci wallet 2>&1 | grep -q usage
  e2e:
    # real Midnight stack (node 1.0.2 · indexer 4.3.5 · proof server 8.1.0) — nightly and on demand, ~5 min
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: aetherdust, POSTGRES_PASSWORD: aetherdust, POSTGRES_DB: aetherdust_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.3.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: start the full local-midnight deployment (chain + api + worker with the real sponsor)
        # the proof-server image has no shell, hence no health check, and `--wait` refuses such services: start it apart
        run: |
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.e2e.yml --profile local-midnight up -d --build proof-server
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.e2e.yml --profile local-midnight up -d --wait --wait-timeout 900 postgres midnight-node indexer api worker
        env: { AETHERDUST_ENV_FILE: e2e.env }
      - name: e2e, in-process (api + worker inside the test; every assertion)
        run: pnpm test:e2e
        env:
          AETHERDUST_TEST_DATABASE_URL: postgres://aetherdust:aetherdust@localhost:5432/aetherdust_test
          MIDNIGHT_NODE_URL: http://127.0.0.1:9944
          MIDNIGHT_INDEXER_URL: http://127.0.0.1:8088/api/v4/graphql
          MIDNIGHT_INDEXER_WS_URL: ws://127.0.0.1:8088/api/v4/graphql/ws
          MIDNIGHT_PROOF_SERVER_URL: http://127.0.0.1:6300
      - name: e2e, deployed (drives the compose api/worker containers; SIGKILLs the worker mid-sponsorship)
        run: pnpm test:e2e:deployed
        env:
          AETHERDUST_ADMIN_TOKEN: e2e-compose-admin-token-0123456789
          AETHERDUST_E2E_WORKER_CONTAINER: aetherdust-worker-1
          AETHERDUST_E2E_KILL_IN: SUBMITTED
          MIDNIGHT_NODE_URL: http://127.0.0.1:9944
          MIDNIGHT_INDEXER_URL: http://127.0.0.1:8088/api/v4/graphql
          MIDNIGHT_INDEXER_WS_URL: ws://127.0.0.1:8088/api/v4/graphql/ws
          MIDNIGHT_PROOF_SERVER_URL: http://127.0.0.1:6300
      - if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.e2e.yml --profile local-midnight logs --no-color worker api | tail -200
        env: { AETHERDUST_ENV_FILE: e2e.env }
      - if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.e2e.yml --profile local-midnight down -v
        env: { AETHERDUST_ENV_FILE: e2e.env }
