# Local `undeployed` Midnight stack pinned to the official support matrix (docs.midnight.network/relnotes/support-matrix, 2026-09-20):
#   node 1.0.2 · indexer 4.3.5 · proof server 8.1.0  (ledger 8.x)
# Ports are fixed so src/config.ts defaults work: node 9944, indexer 8088, proof server 6300.
services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    container_name: aetherdust-spike-proof-server
    command: ['midnight-proof-server -v']
    ports: ['6300:6300']
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6300/version']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  node:
    image: midnightntwrk/midnight-node:1.0.2
    container_name: aetherdust-spike-node
    ports: ['9944:9944']
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  indexer:
    image: midnightntwrk/indexer-standalone:4.3.5
    container_name: aetherdust-spike-indexer
    env_file: standalone.env
    ports: ['8088:8088']
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy
